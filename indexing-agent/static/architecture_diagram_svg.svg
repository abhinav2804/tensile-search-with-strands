<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="900" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Generative Indexing Architecture
  </text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    AI-Powered Document Processing and Search Pipeline
  </text>
  
  <!-- Input Layer -->
  <rect x="300" y="120" width="200" height="100" rx="12" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Input Data
  </text>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="13" fill="#d1fae5" text-anchor="middle">
    Multi-format Support
  </text>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">
    JSON • JSONL • CSV • TXT
  </text>
  
  <!-- Arrow 1 -->
  <line x1="400" y1="220" x2="400" y2="270" stroke="#60a5fa" stroke-width="3"/>
  <polygon points="400,270 395,260 405,260" fill="#60a5fa"/>
  
  <!-- FastAPI Core -->
  <rect x="250" y="270" width="300" height="120" rx="12" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    FastAPI Service
  </text>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">
    Pipeline Orchestration
  </text>
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">
    Real-time SSE Updates
  </text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">
    Smart Chunking (1000 chars)
  </text>
  
  <!-- Arrow 2 -->
  <line x1="400" y1="390" x2="400" y2="440" stroke="#60a5fa" stroke-width="3"/>
  <polygon points="400,440 395,430 405,430" fill="#60a5fa"/>
  
  <!-- Service Layer -->
  <!-- DynamoDB -->
  <rect x="50" y="440" width="200" height="120" rx="12" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
  <text x="150" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    DynamoDB
  </text>
  <text x="150" y="500" font-family="Arial, sans-serif" font-size="13" fill="#fed7aa" text-anchor="middle">
    AWS NoSQL Database
  </text>
  <text x="150" y="525" font-family="Arial, sans-serif" font-size="12" fill="#fed7aa" text-anchor="middle">
    User Metadata
  </text>
  <text x="150" y="545" font-family="Arial, sans-serif" font-size="12" fill="#fed7aa" text-anchor="middle">
    Configuration Storage
  </text>
  
  <!-- AWS Bedrock -->
  <rect x="300" y="440" width="200" height="120" rx="12" fill="#a855f7" stroke="#9333ea" stroke-width="2"/>
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    AWS Bedrock
  </text>
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="13" fill="#e9d5ff" text-anchor="middle">
    AI Enhancement
  </text>
  <text x="400" y="525" font-family="Arial, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">
    Anthropic Models
  </text>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">
    Document Enrichment
  </text>
  
  <!-- Document Processing -->
  <rect x="550" y="440" width="200" height="120" rx="12" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/>
  <text x="650" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Processing
  </text>
  <text x="650" y="500" font-family="Arial, sans-serif" font-size="13" fill="#cffafe" text-anchor="middle">
    Document Handler
  </text>
  <text x="650" y="525" font-family="Arial, sans-serif" font-size="12" fill="#cffafe" text-anchor="middle">
    Schema Validation
  </text>
  <text x="650" y="545" font-family="Arial, sans-serif" font-size="12" fill="#cffafe" text-anchor="middle">
    Batch Processing
  </text>
  
  <!-- Arrows from services -->
  <line x1="150" y1="560" x2="150" y2="640" stroke="#60a5fa" stroke-width="2"/>
  <line x1="150" y1="640" x2="400" y2="640" stroke="#60a5fa" stroke-width="2"/>
  
  <line x1="400" y1="560" x2="400" y2="640" stroke="#60a5fa" stroke-width="2"/>
  
  <line x1="650" y1="560" x2="650" y2="640" stroke="#60a5fa" stroke-width="2"/>
  <line x1="650" y1="640" x2="400" y2="640" stroke="#60a5fa" stroke-width="2"/>
  
  <line x1="400" y1="640" x2="400" y2="690" stroke="#60a5fa" stroke-width="3"/>
  <polygon points="400,690 395,680 405,680" fill="#60a5fa"/>
  
  <!-- Elasticsearch Output -->
  <rect x="300" y="690" width="200" height="100" rx="12" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="725" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Elasticsearch
  </text>
  <text x="400" y="750" font-family="Arial, sans-serif" font-size="13" fill="#fef3c7" text-anchor="middle">
    Search Index
  </text>
  <text x="400" y="770" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">
    Bulk Processing (50 docs/batch)
  </text>
  
  <!-- Technology Stack Box -->
  <rect x="50" y="820" width="700" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="70" y="845" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Tech Stack:
  </text>
  <text x="160" y="845" font-family="Arial, sans-serif" font-size="12" fill="#60a5fa">
    FastAPI
  </text>
  <text x="160" y="865" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">
    Web Framework
  </text>
  
  <text x="280" y="845" font-family="Arial, sans-serif" font-size="12" fill="#f97316">
    Boto3
  </text>
  <text x="280" y="865" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">
    AWS SDK
  </text>
  
  <text x="380" y="845" font-family="Arial, sans-serif" font-size="12" fill="#eab308">
    Elasticsearch
  </text>
  <text x="380" y="865" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">
    Search Engine
  </text>
  
  <text x="520" y="845" font-family="Arial, sans-serif" font-size="12" fill="#10b981">
    Python 3.10+
  </text>
  <text x="520" y="865" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">
    Runtime
  </text>
  
  <text x="650" y="845" font-family="Arial, sans-serif" font-size="12" fill="#a855f7">
    PyYAML
  </text>
  <text x="650" y="865" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">
    Configuration
  </text>
</svg>